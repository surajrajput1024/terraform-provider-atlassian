name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TFE_TOKEN: ${{ secrets.TFE_TOKEN }}

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: go.sum

      - name: Configure Git for private module
        if: ${{ env.GH_PAT != '' }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "git@github.com:"

      - name: Test
        env:
          GOPRIVATE: github.com/surajrajput1024/*
        run: go test -v -count=1 ./...

      - name: Import GPG key
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}

  publish-tfe:
    name: Publish to TFE
    needs: release
    runs-on: ubuntu-latest
    env:
      TFE_HOST: ${{ secrets.TFE_HOST }}
      TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
      TFE_ORG: ${{ secrets.TFE_ORG }}
      GPG_KEY_ID: ${{ secrets.TFE_GPG_KEY_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ env.TFE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Publish provider to TFE
        env:
          TFE_HOST: ${{ secrets.TFE_HOST }}
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
          TFE_ORG: ${{ secrets.TFE_ORG }}
          GPG_KEY_ID: ${{ secrets.TFE_GPG_KEY_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: bash scripts/publish_tfe.sh "${{ github.ref_name }}"
