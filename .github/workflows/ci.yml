name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: go.sum

      - name: Configure Git for private module
        if: env.GH_PAT != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "git@github.com:"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m
        env:
          GOPRIVATE: github.com/surajrajput1024/*

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: go.sum

      - name: Configure Git for private module
        if: env.GH_PAT != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "git@github.com:"

      - name: Test
        env:
          GOPRIVATE: github.com/surajrajput1024/*
        run: go test -v -count=1 ./...

      - name: Build
        env:
          GOPRIVATE: github.com/surajrajput1024/*
        run: go build -v -o terraform-provider-atlassian .

  docs:
    name: Generate and validate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: go.sum

      - name: Configure Git for private module
        if: env.GH_PAT != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "git@github.com:"

      - name: Generate docs
        env:
          GOPRIVATE: github.com/surajrajput1024/*
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name atlassian

      - name: Validate docs
        env:
          GOPRIVATE: github.com/surajrajput1024/*
        run: go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs validate --provider-name atlassian
